# Hoshino: the Arasaka exec who signs the contracts.
#
# Based on a corpo bodyguard so he wears a suit and can actually fight back
# (the receptionist archetype we tried first was a friendly civilian: unarmed,
# untargetable, and displayed as "Receptionist").
#
# displayName points at LocKey#<FNV1a64("cc-g01-hoshino-name")>, which is the
# hash ArchiveXL registers our own localization string under.

# HE MUST NOT OPEN FIRE DURING HIS OWN CONVERSATION (playtest, 2026-08-12: he
# "still gets alert, still attacks, and also alerts other guards").
#
# THREE FIELDS DO THAT, and a fourth was credited with it for months while the
# game threw it away. Measured 2026-08-17 by reading the TweakXL log rather than
# the record: `securityAreaType: Safe` is rejected as an unknown property on
# every run, and always has been. It was removed on 2026-08-18 along with
# `isPlayerCompanion: false`, which set the field to the value it already had.
# See docs/backlog.md 13. What 2.31 calls that field, or whether it lives on
# Character at all, is not established: do not put the line back on a guess.
#
# So the behaviour every playtest confirmed comes from these three alone:
#
#   reactionPreset: ReactionPresets.NoReaction   he does not react to V at all.
#       A real record (reactionComponent.swift:4548 fetches exactly this id) on a
#       real Character field (characterRecord.ReactionPreset(),
#       tweakAIConditionChecks.swift:1444).
#   baseAttitudeGroup: neutral                   which side he is on.
#       The record-level version of a runtime AttitudeAgent.SetAttitudeGroup
#       that would not stick. He inherits the bodyguard's hostile group
#       otherwise; "neutral" is a real group (attitudeSystem.swift, and
#       NPCPuppet.swift:3479 compares this field against group names like this).
#   enableSensesOnStart: false                   he never starts looking for V.
#       No detection, no alert, nothing to broadcast to the guards.
#
# The order those were found in is worth keeping, because the first two attempts
# failed by being the wrong system rather than the wrong value:
#
#   1. a runtime AttitudeAgent.SetAttitudeGroup(n"neutral") - attitude decides
#      which SIDE he is on once a fight starts, not whether he starts one.
#   2. the reaction preset alone - it stops the stim reactions, but he still
#      SEES V and still carries the bodyguard's inherited attitude group.
#
# Reading Character_Record's actual field list (orphans.swift) instead of
# guessing is what produced the two that were missing.
#
# THE BODYGUARD BASE STAYS. He must remain a suited, targetable, killable NPC:
# the receptionist archetype tried early on was unarmed and untargetable, which
# is worse. Only his willingness to START something is removed, and shooting him
# flips him hostile through the game's own damage reaction, so "peaceful until
# attacked" needs no script.

Character.cc_g01_hoshino:
  $base: Character.cpz_arasaka_bodyguard_ranged3_kenshin_mb_rare
  displayName: LocKey#9345113511651514373
  affiliation: Factions.Arasaka
  reactionPreset: ReactionPresets.NoReaction
  baseAttitudeGroup: neutral
  enableSensesOnStart: false
