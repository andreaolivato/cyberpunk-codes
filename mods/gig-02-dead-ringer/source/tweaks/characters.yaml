# ---------------------------------------------------------------------------
# THE TWO THAT ARE FOUGHT
#
# Both are spawned as real bodies by Gig02_Encounter.reds and both keep their
# base record's combat behaviour. Only the name is overridden: an NPC who
# cannot fight back is worse than one whose archetype is wrong.

# THE MERC. `Character.wraiths_grunt2_ranged2_copperhead_ma` is a Wraith
# grunt. Wraiths are not Tyger Claws and not Wakako's, which is right: he is
# an independent who took a contract he believed was hers.
#
# A MAN SINCE 2026-09-06. The recorded voice that landed is a man's, so the
# body follows the voice: the same Wraith grunt record in its male form
# (`_ma` for `_wa`; both names are in the game's TweakDB string table). The
# look is pinned so the mask cannot roll away: `gang__wraith_ma.app` has five
# lvl2 grunt looks and four of them wear the Wraith skull breather
# (`h1_058_ma_mask__skull`); `grunt__lvl2_02` is the skull mask with its vent
# cover, a tactical vest and military gloves. The entity's name for that look
# is `gang__wraith_ma_grunt__lvl2_02`, read off `gang__wraith_ma.ent`. The
# other three masked ones, if this one is wrong in play: `grunt__lvl2_01`
# (skull mask with a cover, ninja harness), `grunt__lvl2_04`, `grunt__lvl2_05`.
#
# HE IS UNKILLABLE, AND NOT BECAUSE OF ANYTHING ON THIS RECORD.
# Gig02_Encounter holds god mode on him: Immortal while he is up, so he takes
# damage and goes down, then Invulnerable once he is down, so a player who
# empties a shotgun into him cannot end the gig by accident. Nothing here does
# that, and nothing here should: a record-level shield could not be released.
#
# `skipDisplayArchetype` is what stops the scanner reading "MERC GRUNT". Both
# name fields are set because Character_Record carries `displayName` AND
# `fullDisplayName` and the scanner shows the full one; gig 01 paid for that
# finding.
# HE DOES NOT START THE FIGHT, AND THE RECORD IS WHERE THAT BELONGS.
#
# It was done from the script first - writing Neutral over him every tick and
# switching his senses off - and it lost a race: a Wraith's own reaction preset
# had already decided it had seen a threat. Playtest: "she targets V
# immediately."
#
# These are gig 01's three peaceful fields on Hoshino, for the same problem and
# in the same order. They cannot lose a race because they are true before he
# exists:
#
#   reactionPreset  NoReaction   nothing to broadcast, nothing to react to
#   baseAttitudeGroup neutral    targetable, not an enemy. Friendly would make
#                                him unshootable, hostile would open fire
#   enableSensesOnStart false    he never starts looking for V at all
#
# Gig02_Encounter switches his senses ON the moment he is hit, and from there
# the game's own reaction rules make him fight back.
Character.cc_g02_merc:
  $base: Character.wraiths_grunt2_ranged2_copperhead_ma
  appearanceName: gang__wraith_ma_grunt__lvl2_02
  displayName: LocKey#11645959053887079659
  fullDisplayName: LocKey#11645959053887079659
  skipDisplayArchetype: true
  reactionPreset: ReactionPresets.NoReaction
  baseAttitudeGroup: neutral
  enableSensesOnStart: false

# TOJI. A Tyger Claw gangster with a gun, which is what the comic draws: pink
# hair, an oni breather, a white pinstripe jacket and a rifle over the
# shoulder. `gangster3_ranged3` is the tier that reads as somebody's lieutenant
# without being a boss with a health bar the player has to grind through. He is
# meant to die quietly.
#
# HE IS THE ONLY PERSON WHO HAS TO DIE, so he is left entirely killable. The
# surviving Claws around him are spawned from base-game records with no
# overrides at all; see Gig02_Encounter.reds.
Character.cc_g02_toji:
  $base: Character.tyger_claws_gangster3_ranged3_sidewinder_ma
  # ONE FACE (design review 2026-09-05): the base rolls a look per spawn, and
  # Char's text describes one man. The lvl3 gangster looks are the game's
  # own top-tier Tyger Claws; which of the four is settled with the dev
  # menu's Toji spawner, and Char's description then matches it.
  appearanceName: gang__tyger_ma_gangster__lvl3_04
  # STRONGER (same review): the rarity tier scales his health and damage
  # the way the game's own elites are scaled.
  rarity: NPCRarity.Elite
  displayName: LocKey#4365166979693360572
  fullDisplayName: LocKey#4365166979693360572
  skipDisplayArchetype: true

