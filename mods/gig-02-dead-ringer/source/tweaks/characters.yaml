# Dead Ringer's Character records.
#
# ONE FILE, because every record here is doing the same small job and a file per
# character would be seven files of four lines. Gig 01 splits by character
# because two of its three carry real behaviour; only two here do.
#
# ---------------------------------------------------------------------------
# MOST OF THESE ARE A NAME AND NOTHING ELSE
#
# A scene line's subtitle takes its speaker name from the speaker's Character
# record, so every voice in the gig needs one even when the body is never seen.
# Seven of the eight below are exactly that: the scene spawns them a kilometre
# away and a hundred metres down, and what the player sees is the base game's
# own NPC standing in the room. tools/gig02/gen_scenes.py has the whole account
# of why the gig is shaped that way and what a capture pass would change.
#
# So `$base` for those is chosen only for being a VERIFIED id of the right
# gender. Nothing about the base body is ever rendered. Do not "tidy" the
# capitalisation of any of them: TweakDBIDs are case-sensitive and a wrong one
# fails silently.
#
# `displayName` is LocKey#<FNV1a64 of the bare key>, which is the hash ArchiveXL
# registers our own localization string under. The strings themselves are in
# tools/gig02/gen_localization.py.

# WAKAKO. The one record here whose base body IS seen: the holocall studio
# spawns this record on its floor spot and the phone renders it, so it has to
# be her. `Character.wakako_okada` is the real one.
#
# The short name rather than the full one, for the reason gig 01 shortened
# Elena's: "Wakako Okada" over every line of a long conversation is a mouthful
# once the standard styling shows speaker names. Her phone CONTACT keeps the
# full name, which is a different string.
Character.cc_g02_wakako:
  $base: Character.wakako_okada
  # HER FACE, the one her own holocall entry names (2026-09-05). This record
  # is a body now: at her desk for the parlor leg, and in the studio.
  appearanceName: wakako_okada_default
  displayName: LocKey#9849343552330629433
  fullDisplayName: LocKey#9849343552330629433
  skipDisplayArchetype: true

# ---------------------------------------------------------------------------
# EVERY displayName BELOW IS ITS OWN STRING, and that sentence is here because
# three of them were not.
#
# `LocKey#1297990292505017833` is the hash of `cc-g02-yoko-short`, which is the
# word "Yoko". Huscle and both queue strangers carried it, so a doorman in
# Wakako's office and four voices in a crowd outside Afterlife all had YOKO
# written over their subtitles. Playtest, 2026-08-26: "the subtitles should
# show random names or labels, like in the comics. Instead they say Yoko, not
# sure why."
#
# The hash is easy to copy and impossible to read, which is how it spread. When
# adding a record, derive the number from the key rather than pasting a
# neighbour's.

# YOKO TSURU. Voice only. The base game has no record for her at all: she is
# an unnamed Clouds NPC placed by a scene, so there is nothing of hers to
# clone, which is also why her phone contact carries the placeholder avatar.
# HER BASE IS NOT MAMA WELLES ANY MORE, and it never should have been once she
# became a body. `$base` was chosen when she was a voice with no body and the
# only requirement was "a verified id of the right gender" - the note at the top
# of this file says exactly that. The moment the community started placing her,
# that base became what the player sees, and what they saw was Mama Welles
# standing in a Kabuki doorway.
#
# `Character.LightCrowd_japantown_wa` was captured in game, so it exists, and it
# is a female civilian of the right district styling.
# HER OWN RECORD, captured off her in game 2026-08-27:
# `Character.wat_kab_netrunner_01`, the fixed NPC on the door of the Dewdrop
# Inn. Nothing renders this today - she is a voice over the real body - but a
# base that is actually her is what makes the acquisition route safe to switch
# on, and it is what stops the next person seeing Mama Welles in Kabuki.
Character.cc_g02_yoko:
  $base: Character.wat_kab_netrunner_01
  # HER FACE (playtest 2026-09-05: the entry's appearance alone put a woman in
  # a beret on her spot). The game's own entry for her names this appearance;
  # it is on the record as well so nothing can pick another.
  appearanceName: service__vendor_wa_vendor_asian_02
  displayName: LocKey#1297990292505017833
  fullDisplayName: LocKey#1297990292505017833
  skipDisplayArchetype: true

# CHAR, Wakako's netrunner. New to the comic.
#
# SHE IS A REAL BODY NOW, spawned by Gig02_Encounter into the chair at the
# Dewdrop Inn. She used to be a voice with the base game's own crowd sitting
# where she should be, and that fails twice: the occupant of that chair is
# ordinary passing crowd, so she was a different woman every load, and scanning
# her showed whoever it happened to be.
#
# `Character.SlackerFemale` is the record captured in that chair, and it was
# confirmed a second time on 2026-08-27 - "perfect style of npc" - so this is
# the look that was asked for rather than the nearest verified id. `skipDisplayArchetype` is what stops the scanner reading the
# archetype instead of her name.
Character.cc_g02_char:
  $base: Character.SlackerFemale
  # ONE FACE (design call 2026-09-05: the same woman in the chair and on the
  # phone). SlackerFemale's default rolls one of twenty; this is one the
  # game pins on its own placements (see gen_community.APPEARANCE).
  appearanceName: slacker_wa_slacker_wa_03
  displayName: LocKey#17642806731671841792
  fullDisplayName: LocKey#17642806731671841792
  skipDisplayArchetype: true

# IDEKA, behind the parlor counter. New to the comic, voice only.
# SAME CORRECTION AS YOKO'S ABOVE. She is a body now, so the base is her face.
Character.cc_g02_ideka:
  $base: Character.LightCrowd_japantown_wa
  displayName: LocKey#13964536880637536916
  fullDisplayName: LocKey#13964536880637536916
  skipDisplayArchetype: true

# HUSCLE, Wakako's doorman, who says "Mh." and nothing else. Voice only.
#
# `Character.q112_wakako_guard` IS THE REAL DOORMAN, captured in game
# 2026-08-26 by pointing at the man standing 6 m from Wakako in her office.
# `q112` is her own quest prefix, so this is the guard the base game puts on her
# door rather than a stand-in chosen for being a verified id. It replaces
# `Character.Nix`, which was exactly that.
Character.cc_g02_huscle:
  $base: Character.q112_wakako_guard
  # The game's own entry for him names this appearance.
  appearanceName: gang__tyger_mb_ozeki__lvl3_02
  displayName: LocKey#15582622219031382
  fullDisplayName: LocKey#15582622219031382
  skipDisplayArchetype: true

# THE FOUR STRANGERS OUTSIDE AFTERLIFE, ONE RECORD EACH.
#
# There are three knots of people out there and the player overhears all three,
# so there are four speakers: two in each of the first two conversations. The
# third group is the merc talking and all three of its lines are his.
#
# THEY WERE ONE RECORD, THEN TWO, AND BOTH WERE WRONG. One record meant one
# voice for everybody. Two records fixed each conversation internally and left
# the two conversations casting the SAME PAIR, because the scenes are ordered
# rather than placed: whichever group is reached first plays `talk_a` and the
# other plays `talk_b`, and both were drawing on the same two throats.
# Playtest, 2026-08-26: "the 2 groups have the same voices, they should have
# different voices."
#
# One record per speaker is the only arrangement that cannot collapse: a voice
# is cast per record, so five records is five castings and nothing has to be
# remembered.
#
# ALL FIVE ARE LABELLED "Voice", which is the comic's own caption for every
# speaker in this crowd (pp. 11-15). Two lines running under one anonymous
# label is what overhearing strangers looks like, and none of these people is
# somebody the story is introducing.
# THE FIVE STRANGERS ARE BODIES NOW, 2026-09-03, so the bases changed: a
# voice-only actor could be based on anyone, and these were Mama Welles and
# Nix, which would have put two story characters in the queue the moment they
# were placed. They are the game's own unarmed crowd look, by gender, and the
# fifth is new for the three-person group. Their lines are the club's own
# ambient chatter (gen_scenes.build_talk_a).
Character.cc_g02_queue_a:
  $base: Character.LightCrowd_japantown_ma
  appearanceName: crowd__districts_ma_rich_07
  # NO REACTION AND NOT A CIVILIAN (playtest 2026-09-05: the queue turned
  # on V when the merc was shot, V killed one, the police came). The merc's
  # own record proved both halves: NoReaction never opened on V, and a
  # neutral-group kill brought nobody. Same two lines here.
  reactionPreset: ReactionPresets.NoReaction
  baseAttitudeGroup: neutral
  displayName: LocKey#1975290165512292963
  fullDisplayName: LocKey#1975290165512292963
  skipDisplayArchetype: true

Character.cc_g02_queue_b:
  $base: Character.LightCrowd_japantown_ma
  appearanceName: crowd__districts_ma_rich_09
  # NO REACTION AND NOT A CIVILIAN (playtest 2026-09-05: the queue turned
  # on V when the merc was shot, V killed one, the police came). The merc's
