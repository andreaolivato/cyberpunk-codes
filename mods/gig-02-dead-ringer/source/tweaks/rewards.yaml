  $base: QuestRewards.sts_wbr_hil_01_completion
  name: sts_cc_g02_completion_loud_kill
  currencyPackage: [ QuestRewards.sts_cc_g02_money_loud_kill ]

QuestRewards.sts_cc_g02_qty_loud_spare:
