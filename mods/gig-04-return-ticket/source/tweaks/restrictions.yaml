# The one gameplay restriction this gig applies: V held still while Johnny
# speaks, at the Claws' van and after Hodan's last call, so V cannot walk
# past him. Gig 03's `cc_g03_hold`, copied: read its file and
# docs/gameplay-restrictions.md before touching this. A base-game record is
# SAVABLE, so the clone turns saving off; it still blocks, because the gate
# reads the gameplay tag the clone inherits.
#
# Gig04_Places.reds applies it while the quest sets `cc_g04_hold`, never with
# V in a vehicle, on a 30 s cap, and lifts it on the first pass of every
# session in case a load caught it held.

GameplayRestriction.cc_g04_hold:
  $base: GameplayRestriction.NoMovement
  savable: false
